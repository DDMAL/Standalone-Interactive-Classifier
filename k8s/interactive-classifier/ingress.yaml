apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ic
  namespace: interactive-classifier
  labels:
    app: ic
  annotations:
    # Page-scan uploads are multi-MB multipart bodies. An nginx proxy fronts
    # ic.simssa.ca and rejects anything over its default client_max_body_size
    # of 1 MB with a 413 before the request reaches uvicorn (verified: a
    # 1048576-byte body reaches the app, 1048577 bytes returns nginx's own 413
    # page). These annotations raise that cap if the nginx is an in-cluster
    # ingress-nginx controller; a host-level proxy in front of the cluster
    # needs `client_max_body_size 64m;` set in its own server block instead.
    # Ignored by controllers that do not recognise them (e.g. traefik).
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.org/client-max-body-size: "64m"
spec:
  ingressClassName: traefik
  rules:
    - host: ic.simssa.ca
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ic
                port:
                  number: 8000
