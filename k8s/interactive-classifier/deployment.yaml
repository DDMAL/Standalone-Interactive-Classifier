apiVersion: apps/v1
kind: Deployment
metadata:
  name: ic
  namespace: interactive-classifier
  labels:
    app: ic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ic
  template:
    metadata:
      labels:
        app: ic
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ic
          image: ghcr.io/ddmal/interactive-classifier:develop-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            # Committed vocabulary CSVs served by /vocabularies (also the
            # default resolved from the repo layout; pinned here explicitly).
            - name: IC_TRAIN_DIR
              value: /app/core/data/train
          # Cold starts (importing numpy/scipy/scikit-image) have taken ~44-51s
          # on this cluster's nodes, past the liveness window. Until this probe
          # succeeds the liveness/readiness probes are held off, so a slow start
          # can't trigger a restart loop. Allows up to 30 x 5s = 150s.
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
