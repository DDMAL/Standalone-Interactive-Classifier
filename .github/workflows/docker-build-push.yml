name: Build and Push Docker Image

# Builds the single-image deploy (root Dockerfile: Vite frontend + FastAPI API)
# and pushes it to GHCR. Tags are derived from the branch name and short SHA so
# the same workflow works for any branch it's triggered from, not just develop.

on:
  push:
    branches: [ develop ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ddmal/interactive-classifier

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        run: |
          branch="${GITHUB_REF_NAME}"
          sha_short="$(git rev-parse --short HEAD)"
          echo "sha_tag=${branch}-${sha_short}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${branch}-latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
