name: Build and Deploy to Kubernetes

on:
  push:
    branches: [ develop ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/ddmal/interactive-classifier

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tags
        id: vars
        run: |
          # Image tags can't contain '/', so feature/foo becomes feature-foo.
          branch="${GITHUB_REF_NAME//\//-}"
          sha_short="$(git rev-parse --short HEAD)"
          echo "sha_tag=${branch}-${sha_short}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${branch}-latest" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # build may run via workflow_dispatch on other branches; only deploy develop.
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Deploy freshly built image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.sha_tag }}
        run: |
          # Render the manifests with the exact image pinned, so the apply
          # creates a single rollout revision on this build. A separate
          # `set image` after applying the develop-latest manifest made two
          # revisions per deploy; `rollout undo` then landed on develop-latest.
          rendered="$(mktemp -d)"
          cp k8s/interactive-classifier/*.yaml "$rendered/"
          sed -i "s|image: ${IMAGE_NAME}:.*|image: ${IMAGE}|" "$rendered/deployment.yaml"
          grep -qF "image: ${IMAGE}" "$rendered/deployment.yaml" \
            || { echo "failed to pin image in deployment.yaml" >&2; exit 1; }
          kubectl apply -f "$rendered/"
          kubectl -n interactive-classifier rollout status deployment/ic --timeout=300s
